- name: Install Apache2
  hosts: all
  become: yes

  vars:
    src_folder: ./App
    dest_folder: /var/www/html/

  tasks:

    - name: Ping1
      ping:

    - block:
      - name: Update apt package cache
        apt:  update_cache=yes

      - name: Install apache
        apt:  
          name : apache2  
          state : present

      - name: Start Apache service
        service:
          name: apache2
          state: started
          enabled: yes
      when: ansible_os_family == "Debian"

    - name: Copy index.html
      copy:
        src : "{{ src_folder }}/{{ item }}"
        dest : "{{ dest_folder }}/"
      loop:
        - "logo.png"
        - "page.html"
        - "error.html"
      notify: Restart Apache service

    - name: Copy index.html
      template:   
        src : "{{ src_folder }}/index.j2"
        dest : "{{ dest_folder }}/index.html"

  handlers:
    - name: Restart Apache service
      service:
        name: apache2
        state: restarted
        enabled: yes
      when: ansible_os_family == "Debian"

    - name: Restart HTTPD service
      service:
        name: httpd
        state: restarted
        enabled: yes
      when: ansible_os_family == "RedHat"