---
# tasks file for installApach
- name: Ping1
  ping:

- name: Update apt package cache
  apt:  update_cache=yes

- name: Install apache
  apt:  
    name : apache2  
    state : present

- name: Start Apache service
  service:
    name: apache2
    state: started
    enabled: yes

- name: Copy index.html
  copy:
    src : "{{ item }}"
    dest : "{{ dest_folder }}/"
  loop:
    - "logo.png"
    - "page.html"
    - "error.html"
  notify: Restart Apache service

- name: Copy index.html
  template:   
    src : "index.j2"
    dest : "{{ dest_folder }}/index.html"