- name: Site Playbook
  hosts: servers
  vars:
    src_folder: ./App
  
  tasks:
    - name: Ping
      ping:

    - name: Create user student
      user:
        name: student
        create_home: true
        state: present
        system: true
        shell: /bin/bash
        append: true
        groups: sudo
        password: "{{ my_vault_pass | password_hash('sha512', vault_password_salt) }}"
        update_password: on_create
      become: true
      when: ansible_facts["os_family"] == "Debian"


    - name: Create user student
      user:
        name: student
        create_home: true
        state: present
        system: true
        shell: /bin/bash
        append: true
        groups: wheel
        password: "{{ my_vault_pass | password_hash('sha512', vault_password_salt) }}"
        update_password: on_create
      become: true
      when: ansible_facts["os_family"] == "RedHat"

    - name: Update apt package cache
      apt: 
        state: latest
        update_cache: yes
      become: true
      when: ansible_facts["os_family"] == "Debian"

      
    - name: Update dnf package cache
      dnf: 
        name: "*"
        state: latest
        update_cache: yes
      become: true
      when: ansible_facts["os_family"] == "RedHat"

    - name: Check if reboot required - Ubuntu
      stat:
        path: /var/run/reboot_required
      register : reboot_required_file


      
    - name: Reboot Ubuntu when required
      reboot:
        msg: Ubuntu OS is rebooed
        connect_timeout: 5
        reboot_timeout: 600
        pre_reboot_delay: 0
        post_reboot_delay: 30
        test_command: whoami
      when: reboot_required_file.stat.exists